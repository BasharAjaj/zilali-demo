<!doctype html>
<html lang="ar" dir="rtl" data-theme="zilali" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم ظلالي</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="../assets/css/daisyui.css">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  .admin-shell { display:grid; grid-template-columns:1fr; min-height:100vh; }
  @media (min-width:1024px){ .admin-shell { grid-template-columns:260px 1fr; } .admin-side { grid-column:1; } .admin-main { grid-column:2; } }
  .admin-side { background:var(--paper-raised); border-inline-start:1px solid var(--line); padding:1.1rem; display:flex; flex-direction:column; gap:.2rem; }
  @media (max-width:1023px){ .admin-side { position:fixed; top:0; bottom:0; right:0; left:auto; width:80%; max-width:300px; z-index:60; transform:translateX(105%); transition:transform .25s; box-shadow:var(--shadow-float); } .admin-side.open { transform:none; } }
  .admin-main { padding:1.1rem; max-width:1180px; }
  .side-link { display:flex; align-items:center; gap:.6rem; padding:.65rem .8rem; border-radius:10px; color:var(--ink-soft); font-weight:600; cursor:pointer; font-size:.95rem; }
  .side-link:hover { background:var(--violet-25); color:var(--ink); }
  .side-link.active { background:var(--violet-50); color:var(--violet-700); }
  .side-head { font-size:.72rem; color:var(--ink-faint); font-weight:700; margin:.9rem .4rem .3rem; }
  .stat-card { background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem; box-shadow:var(--shadow-sm); }
  .a-table { width:100%; border-collapse:collapse; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .a-table th { background:var(--violet-25); padding:.6rem; text-align:right; font-size:.82rem; color:var(--ink-soft); }
  .a-table td { padding:.6rem; border-top:1px solid var(--line); font-size:.88rem; }
  .a-input { width:100%; padding:.55rem; border:1px solid var(--line-strong); border-radius:9px; font:inherit; }
  .a-topbar { position:sticky; top:0; z-index:40; background:oklch(100% 0 0 / .85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:.7rem 1.1rem; display:flex; align-items:center; justify-content:space-between; gap:1rem; }
  .demo-banner { background:var(--warning); color:oklch(28% .09 78); text-align:center; padding:.4rem; font-size:.82rem; font-weight:600; }
</style>
</head>
<body>
<div id="demo-banner" class="demo-banner">وضع العرض التجريبي — كل البيانات افتراضية للعرض</div>
<div class="admin-shell">
  <div class="admin-main">
    <div class="a-topbar">
      <div style="display:flex;align-items:center;gap:.6rem">
        <button class="btn-zi btn-ghost lg:hidden" style="min-height:40px;padding:.4rem;width:44px" onclick="document.querySelector('.admin-side').classList.toggle('open')" aria-label="القائمة">☰</button>
        <div style="position:relative">
          <input class="a-input" style="padding-inline-start:2rem;width:min(52vw,320px)" placeholder="بحث شامل…">
          <span style="position:absolute;inset-inline-start:.5rem;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:.8rem">⌘K</span>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:.7rem">
        <span style="width:38px;height:38px;border-radius:999px;background:var(--violet-500);color:#fff;display:grid;place-items:center;font-weight:700">ظ</span>
      </div>
    </div>
    <div id="admin-view" style="padding-top:1.1rem"></div>
  </div>

  <aside class="admin-side">
    <a class="brand" href="../index.html" style="margin-bottom:1rem">ظلالي</a>
    <div class="side-head">عام</div>
    <div class="side-link" data-route="overview">📊 نظرة عامة</div>
    <div class="side-link" data-route="leads">📥 طلبات التسعير</div>
    <div class="side-head">المحتوى والأسعار</div>
    <div class="side-link" data-route="pricing">💲 الأسعار</div>
    <div class="side-link" data-route="articles">📝 المقالات</div>
    <div class="side-link" data-route="projects">🏗️ المشاريع</div>
    <div class="side-link" data-route="services">🧰 الخدمات</div>
    <div class="side-head">التحسين والإعداد</div>
    <div class="side-link" data-route="seo">🚀 تقرير السيو</div>
    <div class="side-link" data-route="settings">⚙️ الإعدادات</div>
    <div style="margin-top:auto;padding-top:1rem"><a class="side-link" href="../index.html">↗ عرض الموقع</a></div>
  </aside>
</div>
<script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
